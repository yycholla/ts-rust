[package]
name = "ts_svelte_semantic"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ts_goport = { path = "../ts_goport", default-features = false }
ts_svelte = { path = "../ts_svelte" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[workspace]
resolver = "3"
