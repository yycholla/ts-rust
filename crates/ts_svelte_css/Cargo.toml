[package]
name = "ts_svelte_css"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
lightningcss = { path = "vendor/lightningcss", version = "=1.0.0-alpha.72", default-features = false, features = ["bundler", "sourcemap", "serde"] }
parcel_sourcemap = { version = "=2.1.1", features = ["json"] }
cssparser = "=0.37.0"
ts_svelte = { path = "../ts_svelte" }

[[bin]]
name = "svelte-css"
path = "src/bin/svelte-css.rs"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

