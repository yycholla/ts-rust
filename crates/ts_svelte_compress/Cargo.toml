[package]
name = "ts_svelte_compress"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
brotli = { version = "=8.0.4", default-features = false, features = ["std", "disable-timer"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "3"
