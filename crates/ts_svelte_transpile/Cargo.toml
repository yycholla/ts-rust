[package]
name = "ts_svelte_transpile"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[dependencies]
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_codegen = "=0.153.0"
oxc_diagnostics = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_semantic = "=0.153.0"
oxc_span = "=0.153.0"
oxc_transformer = "=0.153.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[dev-dependencies]
oxc_sourcemap = "=9.0.0"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
