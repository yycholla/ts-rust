[package]
name = "ts_svelte_tools"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish = false
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
ts_svelte_mapping = { path = "../ts_svelte_mapping" }
ts_svelte = { path = "../ts_svelte" }
ts_svelte_compiler = { path = "../ts_svelte_compiler" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
url = "=2.5.8"
percent-encoding = "=2.3.2"
rsvelte_lint = { git = "https://github.com/baseballyama/rsvelte", rev = "5ed8ea3a3401b9fbbe780d3b18d6f90073291d6b", default-features = false }
rsvelte = { git = "https://github.com/baseballyama/rsvelte", rev = "5ed8ea3a3401b9fbbe780d3b18d6f90073291d6b", features = ["projection"] }
oxc_allocator = "=0.149.0"
oxc_parser = "=0.149.0"
oxc_span = "=0.149.0"
oxc_ast = "=0.149.0"
oxc_ast_visit = "=0.149.0"
oxc_syntax = "=0.149.0"
oxc_semantic = "=0.149.0"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "=0.10.9"
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
signal-hook = "=0.4.4"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace]
resolver = "3"
[patch."https://github.com/baseballyama/rsvelte"]
rsvelte_core = { path = "../ts_svelte_compiler/vendor/rsvelte_core" }
