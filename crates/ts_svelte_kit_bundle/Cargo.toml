[package]
name = "ts_svelte_kit_bundle"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
publish = false
description = "Native SvelteKit framework plugins for Rolldown"

[dependencies]
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
rolldown_plugin = "=1.2.13"
rolldown_common = "=1.2.13"
rolldown_sourcemap = "=1.2.13"
ts_svelte_kit = { path = "../ts_svelte_kit" }
ts_svelte_transpile = { path = "../ts_svelte_transpile" }

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
