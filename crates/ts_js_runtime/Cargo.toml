[package]
name = "ts_js_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Explicit snapshot ECMAScript module execution with bounded Boa jobs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
boa_engine = { version = "=0.22.0", default-features = false, features = ["fuzz"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
boa_gc = "=0.22.0"
url = "=2.5.8"
encoding_rs = "=0.8.35"
base64 = "=0.22.1"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
multer = { version = "=3.1.0", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "=0.22.0", default-features = false, features = ["fuzz", "js"] }
wasm-bindgen = "=0.2.129"

[lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "3"

[patch.crates-io]
boa_engine = { path = "vendor/boa_engine" }

[[bin]]
name = "js-runtime"
path = "src/main.rs"
