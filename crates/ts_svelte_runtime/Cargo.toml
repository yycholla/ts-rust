[package]
name = "ts_svelte_runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Native SvelteKit server module execution over explicit snapshots"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "svelte-runtime"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[dependencies]
ts_js_runtime = { path = "../ts_js_runtime" }
boa_engine = { version = "=0.22.0", default-features = false, features = ["fuzz"] }
boa_gc = "=0.22.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[workspace]
resolver = "3"

[patch.crates-io]
boa_engine = { path = "../ts_js_runtime/vendor/boa_engine" }

[lints.rust]
unsafe_code = "forbid"
