[package]
name = "ts_tailwind"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Tailwind 4.2.1 stylesheet compiler"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
ts_tailwind_scan = { path = "../ts_tailwind_scan" }
fast-glob = "=0.4.3"
bexpand = "=1.2.0"
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[[bin]]
name = "tailwind"
path = "src/main.rs"
